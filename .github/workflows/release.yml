# Ao publicar uma release (tag vX.Y.Z), gera o .dmg e o anexa à própria release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Gerar .dmg
        run: make dmg VERSION="${GITHUB_REF_NAME#v}"

      - name: Anexar .dmg à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/PodsMic-*.dmg --clobber
